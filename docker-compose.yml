services:
  app:
    build: # Говорит Docker, что  образ нужно собрать самому.
      context: . # Контекст сборки. Точка означает текущую папку. Docker отправит все файлы из этой папки сборщику.
      dockerfile: docker/php/Dockerfile
    container_name: app2
    restart: unless-stopped # Если внутри контейнера произойдет сбой, Docker автоматически поднимет этот контейнер снова. Исключение — остановка вручную.
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html # Это Bind mount. Оно связывает текущую папку на компьютере (.) с папкой /var/www/html внутри контейнера. Благодаря этому, когда меняется код в редакторе, изменения мгновенно появляются в контейнере без его пересборки.
    networks:
      - smartbook-net
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on: # Контейнер app не начнет подниматься, пока не будут выполнены следующие условия:
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  # RabbitMQ Queue Worker
  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: queue-worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work rabbitmq --queue=notifications --sleep=3 --tries=3 --timeout=60
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    networks:
      - smartbook-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_started
      redis:
        condition: service_healthy

  default-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: default-worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=60
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    networks:
      - smartbook-net
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    networks:
      - smartbook-net
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nginx2
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - smartbook-net
    depends_on:
      app:
        condition: service_started
      elasticsearch:
        condition: service_started
      reverb:
        condition: service_started
      node:
        condition: service_completed_successfully

  db:
    image: postgres:17-alpine
    container_name: db2
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartbook
      POSTGRES_USER: smartbook_user
      POSTGRES_PASSWORD: StrongPassword_123!
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/pg_hba.conf:/etc/postgresql/pg_hba.conf
    ports:
      - "5432:5432"
    networks:
      - smartbook-net
    command: ["postgres", "-c", "listen_addresses=*", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin2
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartbook.ru
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - smartbook-net
    depends_on:
      - db

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: smartbook
      MINIO_ROOT_PASSWORD: smartbook123
    volumes:
      - minio_data:/data
    networks:
      - smartbook-net
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 smartbook smartbook123;
      mc mb local/smartbook-covers || true;
      mc anonymous set public local/smartbook-covers;
      exit 0;
      "
    networks:
      - smartbook-net

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    networks:
      - smartbook-net
    depends_on:
      - db

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: smartbook_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - smartbook-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - smartbook-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    environment:
      CLICKHOUSE_DB: smartbook
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - smartbook-net
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: [ "CMD-SHELL", "clickhouse-client --query='SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - smartbook-net

  redis:
    image: 'redis:alpine'
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - smartbook-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  node:
    image: node:20-alpine
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: sh -c "npm install && npm run build"
    depends_on:
      - app
    healthcheck:
      test: [ "CMD", "test", "-f", "/var/www/html/public/build/manifest.json" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

networks:
  smartbook-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  es_data:
  clickhouse_data:
  redis_data:
